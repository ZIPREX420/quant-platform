[project]
name = "quant-platform"
version = "0.1.0"
description = "AI-powered cryptocurrency trading platform (PROJECT GENESIS primary repository)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.21",
]

[project.scripts]
quant-desk = "quant_platform.cli:main"
quant-desk-outcomes = "quant_platform.cli_outcomes:main"
quant-validate-trades = "quant_platform.validation.cli:main"
quant-status = "quant_platform.monitoring.status:main"
quant-cycle = "quant_platform.cli_cycle:main"
quant-dashboard = "quant_platform.cli_dashboard:main"
quant-forward = "quant_platform.cli_forward:main"

[project.optional-dependencies]
desk = [
    "langgraph>=0.4",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "typing-extensions>=4.12",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "langgraph>=0.4",  # ResearchGraph tests run against a stub LLM; only the graph engine is needed
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicit, intentional rule set. Previously unset, which made ruff enable its
# entire rule surface (~400 rules) and left CI red on pre-existing findings.
# Curated to high-signal, mostly-autofixable families; opinionated/behavioural
# families (datetime-tz, pyupgrade, flake8-pyi, pylint, bandit) are deliberately
# not selected and can be adopted later as focused efforts.
select = ["E4", "E7", "E9", "W", "F", "I", "B", "BLE001", "UP", "SIM", "C4", "RUF"]
ignore = [
    "UP037",  # keep quoted forward-ref annotations (safe under the py310 target)
]

[tool.ruff.lint.per-file-ignores]
# Tests favour readability over a few lint niceties.
"tests/**" = [
    "RUF012",  # class-level constant fixtures are idiomatic in test classes
    "RUF005",  # list concatenation reads fine in fixtures
    "SIM117",  # nested `with` blocks are clearer in test setups
    "C408",    # dict(...) in parametrize tables is intentional
    "B905",    # zip() without strict= is fine on controlled test data
    "RUF007",  # zip() over itertools.pairwise() acceptable in tests
    "RUF059",  # deliberately unused unpacked values in tests
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # cross-test imports (tests.unit.*) under bare `pytest` as CI runs it
